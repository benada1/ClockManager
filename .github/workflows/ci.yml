name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build + test
    runs-on: ubuntu-latest
    # A SQL Server service container is added in Phase 2, together with the first
    # integration tests that need it (see plans/00-master-plan.md, Phase 0).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore backend/ClockManager.sln
      - run: dotnet build backend/ClockManager.sln --no-restore --configuration Release
      # TEMPORARY: the integration tests need SQL Server; the CI SQL container arrives in plan 02 step 2.
      - run: dotnet test backend/ClockManager.sln --no-build --configuration Release --filter "Category!=Integration" --logger "trx" --results-directory TestResults
      - name: Test again in an exotic time zone and culture (E16)
        run: dotnet test backend/ClockManager.sln --no-build --configuration Release --filter "Category!=Integration" --logger "trx;LogFileName=tz.trx" --results-directory TestResults
        env:
          TZ: Pacific/Kiritimati
          CLOCKMANAGER_TEST_TZ: Pacific/Kiritimati
          CLOCKMANAGER_TEST_CULTURE: th-TH
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  frontend:
    name: Frontend build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  clock-guard:
    name: Clock guard (no local clock for punches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for forbidden local-clock APIs
        shell: pwsh
        run: ./.claude/skills/verify/verify.ps1 -Scope clock
